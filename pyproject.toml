[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scperteval-reproducibility"
version = "0.1.0"
description = "Public data, model, and evaluation workflows for scPertEval experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anndata>=0.10,<0.13",
  "geomloss==0.2.6",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "rdkit>=2024.9",
  "requests>=2.32",
  "scanpy>=1.10,<1.13",
  "scperteval @ git+https://github.com/Virtual-Cell-Research-Community/scPertEval.git@94f10fe52c03b984078034aa4afb426e8f58df74",
  "scipy>=1.12",
  "torch==2.5.1",
]

[project.scripts]
reproduce-protocol-behavior = "analyses.protocol_behavior.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["analyses", "workflows"]

[tool.hatch.metadata]
allow-direct-references = true

