[project]
name = "scperteval-reproducibility"
version = "0.1.0"
description = "Public data, model, and evaluation workflows for scPertEval experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anndata>=0.10,<0.13",
  "numpy>=1.26",
  "pandas>=2.1",
  "rdkit>=2024.9",
  "requests>=2.32",
  "scanpy>=1.10,<1.13",
  "scipy>=1.12",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

