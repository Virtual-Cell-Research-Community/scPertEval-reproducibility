schema_version = 1
id = "sams-vae-s"
title = "SAMS-VAE(S)"
capability = "population"
modalities = ["chemical"]
tasks = ["leave-one-context-out"]
implementation_status = "adapter-environment-and-full-architecture-synthetic-smoke-complete-full-fold-pending"

[implementation]
repository = "https://github.com/altoslabs/perturbench"
revision = "c84038bc1ea409aa54f3832cfa6f34f5059adf0c"
variant = "simplified SAMS-VAE without sparse mask or global perturbation latent"
reference = "PerturBench Srivatsan20 covariate-transfer configuration"

[adapter]
path = "models/sams_vae_s/train_predict.py"
environment = "models/pixi.toml#sams-vae-s"
lockfile = "models/pixi.lock"

[input]
space = "normalize_total_10000_log1p"
perturbation_conditioning = "one joint categorical embedding across every drug-dose condition"
context_conditioning = "categorical cell-line covariate"

[output]
space = "normalize_total_10000_log1p"
evaluation_transform = "identity"
prediction = "native population predictions"

[training]
seeds = [42]
maximum_epochs = 500
minimum_epochs = 5
batch_size = 256
early_stopping_patience = 50
checkpoint_selection = "minimum validation loss"
disable_sparsity = true
disable_perturbation_effect_distribution = true
generative_counterfactual = true
hidden_dim_x = 2560
hidden_dim_cond = 329
latent_dim = 32
dropout = 0.4
inject_covariates_encoder = true
inject_covariates_decoder = true
n_layers_encoder_x = 4
n_layers_encoder_e = 2
n_layers_decoder = 3
learning_rate = 0.000341765289234546
weight_decay = 6.943657713062555e-08
hyperparameter_policy = "PerturBench published best-parameter SciPlex3 configuration; no new HPO"

[validation]
synthetic_gpu_smoke = "passed with the complete published architecture and one training epoch"
checkpoint_reload = "best validation checkpoint was reloaded before prediction"
restart_safety = "verified completed run is skipped"
representative_full_fold = "pending"

