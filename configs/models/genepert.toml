schema_version = 1
id = "genepert"
title = "GenePert"
capability = "point"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]
implementation_status = "adapter-and-synthetic-smoke-complete-full-fold-pending"

[implementation]
repository = "https://github.com/zou-group/GenePert"
revision = "31c0034211010696ba76dc62cb875af51bfe6f4a"

[adapter]
path = "models/genepert/train_predict.py"
environment = "models/pixi.toml#genepert"
lockfile = "models/pixi.lock"

[input]
space = "perturbation-level mean normalized-log1p expression"
perturbation_conditioning = "the same pinned GenePT embedding table used by fMLP-GenePT"

[output]
space = "normalized-log1p expression"
evaluation_transform = "identity"
prediction = "one centroid per held-out perturbation"

[training]
seeds = [42]
method = "ridge regression"
development_pool = "train plus validation; the method performs no checkpoint selection"
alpha = 10.0
hyperparameter_policy = "fixed from the official K562 example before benchmark outcomes; no dataset-specific tuning"

