schema_version = 1
id = "fmlp-esm2"
title = "fMLP-ESM2"
capability = "point"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]
implementation_status = "adapter-generator-full-asset-and-synthetic-smoke-complete-full-fold-pending"

[implementation]
repository = "https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines"
revision = "15361aec8392fb45a75c8c9da88ca5e6510fca97"
model_key = "fmlp_esm2"

[implementation.esm2]
model = "facebook/esm2_t48_15B_UR50D"
revision = "5fbca39631164edc1d402a5aa369f982f72ee282"
pooling = "mean over last hidden state including special tokens, matching Miller's generator"
maximum_protein_residues = 1024
weight_serialization = "pytorch-bin (the pinned revision has no safetensors; weights are otherwise identical)"

[implementation.esm2.asset]
path = "models/fmlp/cache/esm2-15b/esm2_t48_15B_UR50D_mean.pickle"
manifest = "models/fmlp/cache/esm2-15b/esm2_t48_15B_UR50D_mean.manifest.json"
sha256 = "1b1484dc5a49c3ab4c72f708092f49f5f4d91b4091d9189d56adc84e0a76254a"
size_bytes = 27738190
target_count = 1352
dimensions = 5120
target_sha256 = "9dadbd13e68c4401b0c8055f116dce35ad94daf835b50cccff3fde569ce8a216"
validation = "all vectors finite and common-dimensional"

[adapter]
path = "models/fmlp/train_predict.py"
asset_generator = "models/fmlp/generate_esm2_embeddings.py"
environment = "models/pixi.toml#fmlp"
asset_environment = "models/pixi.toml#esm2-assets"
lockfile = "models/pixi.lock"

[input]
space = "normalized-log1p expression"
perturbation_conditioning = "mean-pooled facebook/esm2_t48_15B_UR50D embeddings from Ensembl release 113 canonical protein sequences"

[output]
space = "normalized-log1p expression"
evaluation_transform = "identity"
prediction = "one centroid per held-out perturbation"

[training]
seeds = [42]
epochs = 100
batch_size = 256
learning_rate = 0.001
latent_dim = 128
hidden_dim = 512
validation_every_epochs = 10
checkpoint_selection = "minimum validation MSE"
hyperparameter_policy = "Miller et al. published fMLP configuration; no dataset-specific tuning"

