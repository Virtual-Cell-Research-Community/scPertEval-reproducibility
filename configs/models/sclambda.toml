schema_version = 1
id = "sclambda"
title = "scLAMBDA"
capability = "point"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]

[implementation]
package = "gefeiwang/scLAMBDA"
revision = "a5be849797eb26e098c7002b819a5261f51dbead"

[adapter]
path = "models/sclambda/train_predict.py"
environment = "models/pixi.toml#sclambda"
lockfile = "models/pixi.lock"

[input]
space = "normalize_total_10000_log1p"
perturbation_conditioning = "GenePT embedding for every perturbation in the frozen common cohort"

[output]
space = "normalize_total_10000_log1p"
evaluation_transform = "identity"
prediction = "one centroid per held-out perturbation"

[training]
seeds = [42]
epochs = 200
control_size = 300
scalability_patch = "categorical-embedding-table-v1"

[resources]
gpus = 1
cpus = 16
memory_gb = 256
time = "2-00:00:00"
