schema_version = 1
id = "cpa"
title = "Compositional Perturbation Autoencoder"
capability = "population"
modalities = ["genetic", "chemical"]
tasks = ["leave-one-context-out"]

[implementation]
repository = "https://github.com/theislab/cpa"
revision = "pypi:cpa-tools==0.8.8"
version = "0.8.8"
reference = "scArchon CPA hyperparameters; joint CPA API replaces its per-target wrapper"
scarchon_container = "docker.io/hdsu/cpa_env:latest"
scarchon_container_digest = "sha256:2ec574f836320445985f5cb284eff2175b865c16dc22e47587ceb45c7cbd084e"

[adapter]
path = "models/cpa/train_predict.py"
environment = "models/pixi.toml#cpa"
lockfile = "models/pixi.lock"

[input]
space = "normalize_total_10000_log1p"
is_count_data = false
perturbation_conditioning = "one joint categorical embedding across every condition in a fold"
context_conditioning = "categorical covariate"

[output]
space = "normalize_total_10000_log1p"
evaluation_transform = "identity"

[training]
seeds = [42]
max_epochs = 100
early_stop_patience = 5
check_val_every_n_epoch = 5
batch_size = 64
hyperparameter_policy = "scArchon-established configuration; Gaussian reconstruction for documented log1p input"

[resources]
gpus = 1
cpus = 16
memory_gb = 64
time = "12:00:00"
