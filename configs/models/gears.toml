schema_version = 1
id = "gears"
title = "GEARS"
capability = "point"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]

[implementation]
package = "cell-gears"
version = "0.1.2"
artifact_sha256 = "4db11fd69ce4825cf9a3e4a533c7e864ad0de3d60260bc9e88fc5d6a3c7b095a"

[adapter]
path = "models/gears/train_predict.py"
environment = "models/pixi.toml#gears"
lockfile = "models/pixi.lock"

[input]
space = "normalize_total_10000_log1p"
perturbation_conditioning = "single-gene identity with the frozen GEARS gene-to-GO support cohort"

[output]
space = "normalize_total_10000_log1p"
evaluation_transform = "identity"
prediction = "one centroid per held-out perturbation"

[training]
seeds = [42, 43, 44]
epochs = 20
batch_size = 32

[resources]
gpus = 1
cpus = 64
memory_gb = 64
time = "2-00:00:00"
