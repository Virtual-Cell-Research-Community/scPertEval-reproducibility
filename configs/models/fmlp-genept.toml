schema_version = 1
id = "fmlp-genept"
title = "fMLP-GenePT"
capability = "point"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]
implementation_status = "adapter-and-synthetic-smoke-complete-full-fold-pending"

[implementation]
repository = "https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines"
revision = "15361aec8392fb45a75c8c9da88ca5e6510fca97"
model_key = "fmlp_genept"

[adapter]
path = "models/fmlp/train_predict.py"
environment = "models/pixi.toml#fmlp"
lockfile = "models/pixi.lock"

[input]
space = "normalized-log1p expression"
perturbation_conditioning = "the same pinned GenePT embedding table used by GenePert"

[output]
space = "normalized-log1p expression"
evaluation_transform = "identity"
prediction = "one centroid per held-out perturbation"

[training]
seeds = [42]
epochs = 100
batch_size = 256
learning_rate = 0.001
latent_dim = 128
hidden_dim = 512
validation_every_epochs = 10
checkpoint_selection = "minimum validation MSE"
hyperparameter_policy = "Miller et al. published fMLP configuration; no dataset-specific tuning"

