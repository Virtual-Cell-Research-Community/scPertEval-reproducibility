schema_version = 1
id = "trvae"
title = "trVAE"
capability = "population"
modalities = ["genetic", "chemical"]
tasks = ["leave-one-context-out"]

[implementation]
repository = "https://github.com/theislab/trvaep"
revision = "pypi:trvaep==0.1.0"
scarchon_repository = "https://github.com/hdsu-bioquant/scArchon"
scarchon_revision = "42f6c2c202936966ae10c522f784881128b7efbb"
scarchon_container = "docker.io/hdsu/trvae_env:latest"
scarchon_container_digest = "sha256:c586e5868c1aaab4ff670fe90edbe9e6bec8b76874db11954c041775c1bd77bd"
reference = "official PyTorch implementation with scArchon architecture and training configuration"

[adapter]
path = "models/trvae/train_predict.py"
compatibility_patch = "models/trvae/scarchon_patch.py"
split_materialization = "copy train and validation AnnData views once before dense-only trvaep loading"
environment = "models/pixi.toml#trvae"
lockfile = "models/pixi.lock"

[input]
space = "normalize_total_10000_log1p"
perturbation_conditioning = "one joint categorical condition across all perturbations"
context_conditioning = "implicit in source-cell expression with held-out controls available"

[output]
space = "normalize_total_10000_log1p"
evaluation_transform = "identity"

[training]
seeds = [42, 43, 44]
max_epochs = 200
batch_size = 512
latent_dim = 10
encoder_layers = [128, 32]
decoder_layers = [32, 128]
alpha = 0.0001
beta = 10.0
use_mmd = true
early_stopping = false
hyperparameter_policy = "scArchon configuration; no dataset-specific tuning"

[resources]
gpus = 1
cpus = 16
memory_gb = 96
time = "24:00:00"
