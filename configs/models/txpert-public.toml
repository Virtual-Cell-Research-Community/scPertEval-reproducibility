schema_version = 1
id = "txpert-public"
title = "TxPert (public STRING+GO variant)"
capability = "population"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]
implementation_status = "representative-full-fold-scaling-gate-passed"

[implementation]
repository = "https://github.com/valence-labs/TxPert"
revision = "08d82eea86746b044cf7531f4ec8c5f60e1cb73f"
variant = "public Exphormer-MG with STRING and GO only"
license = "Recursion Non-Commercial End User License Agreement"
proprietary_knowledge_graphs = false

[adapter]
path = "models/txpert_public/train_predict.py"
environment = "models/pixi.toml#txpert-public"
lockfile = "models/pixi.lock"

[input]
space = "reference-workflow"
perturbation_conditioning = "transferable public STRING and GO graph features"

[output]
space = "normalize_total_4000_log1p"
evaluation_transform = "inverse-log-clip-nonnegative-renormalize-total-10000-log1p"
prediction = "per-cell predictions transformed from held-out controls"

[training]
seeds = [42]
epochs = 50
batch_size = 64
learning_rate = 0.001
warmup_epochs = 5
scheduler = "cosine"
early_stop_monitor = "validation Pearson correlation of control-centered mean response"
early_stop_patience = 40
training_entry_point = "reconstructed from optimization logic and released public checkpoint metadata because upstream main.py exposes only inference/predict"
hyperparameter_policy = "official public K562-essential configuration; no dataset-specific tuning"

[validation]
representative_full_fold = "one-epoch scaling probe passed on frozen K562-essential fold 0"
one_epoch_training_time_seconds = 122
total_probe_wall_time_seconds = 295
conservative_full_budget_projection_gpu_hours = 1.75
prediction_shape = [36972, 8563]
checkpoint_size_bytes = 118017522
prediction_size_bytes = 1268626780
population_policy = "exact observed treated-cell count for every test perturbation"
completion_contract = "condition and gene order, exact population sizes, finite values, checksums, and completion record validated"

