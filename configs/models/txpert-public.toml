schema_version = 1
id = "txpert-public"
title = "TxPert (public STRING+GO variant)"
capability = "population"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]
implementation_status = "adapter-pending"

[implementation]
repository = "https://github.com/valence-labs/TxPert"
revision = "08d82eea86746b044cf7531f4ec8c5f60e1cb73f"
variant = "public Exphormer-MG with STRING and GO only"
license = "Recursion Non-Commercial End User License Agreement"
proprietary_knowledge_graphs = false

[adapter]
path = "models/txpert_public/train_predict.py"
environment = "models/pixi.toml#txpert-public"
lockfile = "models/pixi.lock"

[input]
space = "reference-workflow"
perturbation_conditioning = "transferable public STRING and GO graph features"

[output]
space = "normalize_total_10000_log1p"
evaluation_transform = "identity"
prediction = "per-cell predictions transformed from held-out controls"

[training]
seeds = [42]
hyperparameter_policy = "official public K562-essential configuration; no dataset-specific tuning"

