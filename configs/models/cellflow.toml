schema_version = 1
id = "cellflow"
title = "CellFlow"
capability = "population"
modalities = ["genetic"]
tasks = ["unseen-perturbation"]
implementation_status = "representative-full-fold-scaling-gate-passed"

[implementation]
repository = "https://github.com/shiftbioscience/Perturbation-Models-Outperform-Baselines"
revision = "15361aec8392fb45a75c8c9da88ca5e6510fca97"
model_key = "cellflow"
reference_implementation = "https://github.com/theislab/cellflow"
reference_revision = "0f55ba20c49bcee60da979bd5a9fb4ab16420b1e"
license = "PolyForm Noncommercial License 1.0.0"

[adapter]
path = "models/cellflow/train_predict.py"
environment = "models/pixi.toml#cellflow"
lockfile = "models/pixi.lock"

[input]
space = "normalize_total_10000_log1p"
perturbation_conditioning = "pinned ESM2 embeddings permit unseen-target generalization"

[output]
space = "normalize_total_10000_log1p reconstructed from the centered 50-PC model space"
evaluation_transform = "identity"
prediction = "native flow-matching population predictions, exactly size-matched to each observed test population"

[training]
seeds = [42]
iterations = 200000
batch_size = 1024
learning_rate = 0.00005
optimizer = "Adam with optax.MultiSteps(every_k_schedule=20)"
pca_components = 50
condition_embedding_dim = 1024
hidden_dims = [4096, 4096, 4096]
decoder_dims = [4096, 4096, 4096]
control_cells_train = 2048
control_cells_validation = 256
control_cells_test = 512
validation_usage = "metrics at the end of training; not checkpoint selection"
hyperparameter_policy = "Miller et al. published unseen-gene configuration; no dataset-specific tuning"

[validation]
synthetic_gpu_smoke = "passed with the complete published architecture and one training iteration"
checkpoint_reload = "reloaded predictions match the archived predictions"
restart_safety = "verified completed run is skipped"
representative_full_fold = "200-iteration scaling probe passed on frozen K562-essential fold 0"
probe_iterations = 200
steady_iterations_per_second = 81.18
total_probe_wall_time_seconds = 1475
conservative_full_budget_projection_gpu_hours = 1.25
maximum_observed_gpu_memory_mib = 73994
prediction_shape = [36972, 8563]
population_policy = "exact observed treated-cell count for every test perturbation"
model_checkpoint_size_bytes = 5838404477
pca_reference_size_bytes = 3930813779
prediction_size_bytes = 1268589848
completion_contract = "condition and gene order, exact population sizes, finite values, checksums, and completion record validated"

